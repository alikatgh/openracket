name: Mac genuine GUI producer-phase observation (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Mandatory native preflight and independent GUI observer clone
        id: gui_prepare
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-gui-phase.py prepare
      - name: Genuine GUI common-observer control
        if: success() && steps.gui_prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 retained-host/scripts/ci/run-gui-phase.py control
      - name: Genuine GUI producer-phase observation
        if: always() && steps.gui_prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 retained-host/scripts/ci/run-gui-phase.py observed
      - name: Strict actual GUI completion and phase evidence acceptance
        if: always() && steps.gui_prepare.outcome == 'success'
        timeout-minutes: 2
        run: python3 retained-host/scripts/ci/run-gui-phase.py accept
      - name: Verify original full runtime including bytecode unchanged
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 4
        run: python3 retained-host/scripts/ci/run-gui-phase.py verify
      - name: Report genuine GUI observations and explicit limits
        if: always()
        run: |
          if test -f retained-host/reports/gui-phase-ci/summary.md; then
            cat retained-host/reports/gui-phase-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation failed before genuine GUI observation was available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Two fresh GUI processes, one shared pinned runtime and fixture, original tools and 256 MiB setting. Actual terminal, current trace application and final lexer completion remain strict gates.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bounded producer points are diagnostic. No standalone replay, worker barrier, sampling thread or new logger subscription. One pair cannot establish precise overhead or a product speedup.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No artifact/cache/release/package upload or paid runner. Delivered preview and broader release evidence remain separate.' >> "$GITHUB_STEP_SUMMARY"
