name: Retained DrRacket native checks (public free runners)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }} # Standard free public runners only. No larger runners.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install Linux native display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick libgtk-3-0t64 fonts-noto-cjk
      - name: Install checksum-pinned full official Racket 9.3
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Prepare and headless integrity checks
        timeout-minutes: 3
        run: bash retained-host/scripts/ci/run-phase.sh prepare
      - name: Verify pristine stock native host
        timeout-minutes: 3
        run: bash retained-host/scripts/ci/run-phase.sh stock
      - name: Compile disposable retained overlay and actual DrRacket
        timeout-minutes: 8
        run: bash retained-host/scripts/ci/run-phase.sh overlay
      - name: Verify retained fallback, light and dark native hosts
        timeout-minutes: 6
        run: bash retained-host/scripts/ci/run-phase.sh modern
      - name: Verify native Stop, input, WXME and Check Syntax preservation
        timeout-minutes: 8
        run: bash retained-host/scripts/ci/run-phase.sh followon
      - name: Measure matched pristine and retained native editors
        timeout-minutes: 15
        run: bash retained-host/scripts/ci/run-phase.sh performance
      - name: Report actual test results
        if: always()
        run: |
          if test -f retained-host/reports/ci-summary.md; then
            cat retained-host/reports/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Setup failed before native tests; no GUI validation is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'No Actions artifacts, caches, releases, packages, or other paid-storage outputs were uploaded.' >> "$GITHUB_STEP_SUMMARY"
