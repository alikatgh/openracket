name: Mac preview fresh-profile capacity and portable launch (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Verify source, runtime isolation and native profile safety tests
        id: portable_prepare
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-portable.py prepare
      - name: Actual portable installation and fresh 256 MiB initialization
        id: portable_install
        timeout-minutes: 20
        run: python3 retained-host/scripts/ci/run-portable.py install
      - name: Actual modern, autosave opt-out and stock launchers
        id: portable_launch
        timeout-minutes: 6
        run: python3 retained-host/scripts/ci/run-portable.py launch
      - name: Restore, explicit settings, repeated setup and stock isolation
        if: success() && steps.portable_launch.outcome == 'success'
        timeout-minutes: 23
        run: python3 retained-host/scripts/ci/run-portable.py memory
      - name: Combined save and recovery regression in fresh stock128 profiles
        if: always() && steps.portable_install.outcome == 'success'
        timeout-minutes: 8
        run: python3 retained-host/scripts/ci/run-portable.py save
      - name: Verify both original runtime trees including bytecode unchanged
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 7
        run: python3 retained-host/scripts/ci/run-portable.py verify
      - name: Report actual portable outcomes and remaining limits
        if: always()
        run: |
          if test -f retained-host/reports/portable-ci/summary.md; then
            cat retained-host/reports/portable-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation failed before a portable installation result was available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Only newly reserved preview profiles receive 256 MiB. Existing profiles, explicit settings and the separate stock launcher are checked through actual setup and GUI readback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Capacity evidence comes from the separate nine-trial stock matrix. This installer gate does not claim a broad speedup or repeat the diagnostic profiling.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Earlier Stop and broader release gates remain recorded. No artifact/cache/release/package upload or paid runner.' >> "$GITHUB_STEP_SUMMARY"
