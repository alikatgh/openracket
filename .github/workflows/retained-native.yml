name: Mac same-owner binding table correctness and matched GUI trials (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Verify frozen binding candidate and independent runtimes
        id: binding_prepare
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-binding.py prepare
      - name: Mandatory native telemetry helpers with no skipped gates
        id: binding_helpers
        if: always() && steps.binding_prepare.outcome == 'success'
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-binding.py helpers
      - name: Actual binding methods, complete traces, graph and keymap navigation
        id: binding_correctness
        if: always() && steps.binding_prepare.outcome == 'success'
        timeout-minutes: 20
        run: python3 retained-host/scripts/ci/run-binding.py correctness
      - name: Six interleaved genuine GUI application trials
        if: success() && steps.binding_correctness.outcome == 'success' && steps.binding_helpers.outcome == 'success'
        timeout-minutes: 38
        run: python3 retained-host/scripts/ci/run-binding.py telemetry
      - name: Verify original full runtime including bytecode unchanged
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 4
        run: python3 retained-host/scripts/ci/run-binding.py verify
      - name: Report same-owner binding table gates and complete-work timing
        if: always()
        run: |
          if test -f retained-host/reports/binding-ci/summary.md; then
            cat retained-host/reports/binding-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation failed before same-owner binding table evidence was available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'A default-off syncheck/gui.rkt binding-table candidate in an independent runtime. Correctness gates precede three fresh stock/candidate GUI pairs; both use 256 MiB, original stock tools and 20 ms batching.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Producer phases stay off in both measured arms. All source/metadata, terminal, full current application and final lexer endpoints must pass; failed or incomplete work is retained.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The first and second public getter costs are measured separately after primary application readiness. No artifact/cache/release upload, paid runner or default product change. Historical release gaps remain separate.' >> "$GITHUB_STEP_SUMMARY"
