name: Mac arrow and queued-gap attribution (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 35
    env:
      PYTHONOPTIMIZE: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Verify arrow and queued-gap probe and mandatory native preflight
        id: annotation_prepare
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-arrow-gap.py prepare
      - name: Genuine GUI control with common slice counters
        if: always() && steps.annotation_prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 retained-host/scripts/ci/run-arrow-gap.py control
      - name: Genuine GUI with nested arrow timings and queued-gap samples
        if: always() && steps.annotation_prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 retained-host/scripts/ci/run-arrow-gap.py observed
      - name: Require complete actual application and exact accounting
        if: always() && steps.annotation_prepare.outcome == 'success'
        timeout-minutes: 3
        run: python3 retained-host/scripts/ci/run-arrow-gap.py accept
      - name: Verify original runtime after arrow and queued-gap diagnostic
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 4
        run: python3 retained-host/scripts/ci/run-arrow-gap.py verify
      - name: Report bounded arrow and queued-gap attribution
        if: always()
        run: |
          if test -f retained-host/reports/arrow-gap-probe-ci/summary.md; then cat retained-host/reports/arrow-gap-probe-ci/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'One genuine stock GUI control/observed pair at verified 256 MiB. Diagnostic counters and sparse queued-gap samples do not establish an optimization speedup.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original workload, tool settings and deadlines retained. No artifact/cache/release uploads, paid runner, or security/default-handler changes.' >> "$GITHUB_STEP_SUMMARY"
