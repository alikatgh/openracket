name: Mac native light tools and normal Quit retry (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 200
    env:
      PYTHONOPTIMIZE: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        timeout-minutes: 5
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Check pure functional orchestration contracts
        timeout-minutes: 3
        run: python3 -B retained-host/scripts/ci/test-functional-phase.py
      - name: Install checksum-pinned full official Racket 9.3 once
        id: runtime
        timeout-minutes: 20
        run: bash retained-host/scripts/ci/install-full-racket.sh
      # Baseline before either group's bundle or private registration operations.
      - name: Prepare exact native Quit sources and independent runtime
        id: quit_prepare
        if: >-
          always() && steps.runtime.outcome == 'success'
        timeout-minutes: 15
        run: python3 retained-host/scripts/ci/run-functional-phase.py quit prepare -- python3 retained-host/scripts/ci/run-native-quit.py prepare
      - name: Prepare frozen stock and modern-light callers
        id: light_prepare
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 20
        run: python3 retained-host/scripts/ci/run-functional-phase.py light prepare -- python3 retained-host/scripts/ci/run-light-tools.py prepare
      - name: Six actual stock and modern-light tool cases
        id: light_cases
        # Per-runtime preparation still controls each independent stock/light pair.
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 40
        run: python3 retained-host/scripts/ci/run-functional-phase.py light cases -- python3 retained-host/scripts/ci/run-light-tools.py cases
      - name: Six genuine clean save and discard Quit cases
        id: quit_cases
        # A cleaned light assertion failure is independent; durable unsafe cleanup
        # or an interrupted case phase blocks the wrapper before any next GUI spawn.
        if: >-
          always() && steps.runtime.outcome == 'success' && steps.quit_prepare.outcome == 'success'
        timeout-minutes: 70
        run: python3 retained-host/scripts/ci/run-functional-phase.py quit cases -- python3 retained-host/scripts/ci/run-native-quit.py cases
      - name: Verify original and selected light runtimes unconditionally
        id: light_verify
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 4
        run: python3 retained-host/scripts/ci/run-light-tools.py verify
      - name: Verify Quit runtimes original preferences and final file handler
        id: quit_verify
        # Read-only witnesses run even when a preparation or either GUI group failed.
        # This final handler comparison brackets every group's bundle operations.
        if: >-
          always() && steps.runtime.outcome == 'success'
        timeout-minutes: 5
        run: python3 retained-host/scripts/ci/run-native-quit.py verify
      - name: Report both native functional outcomes
        if: always()
        timeout-minutes: 2
        env:
          LIGHT_PREPARE: ${{ steps.light_prepare.outcome }}
          LIGHT_CASES: ${{ steps.light_cases.outcome }}
          LIGHT_VERIFY: ${{ steps.light_verify.outcome }}
          QUIT_PREPARE: ${{ steps.quit_prepare.outcome }}
          QUIT_CASES: ${{ steps.quit_cases.outcome }}
          QUIT_VERIFY: ${{ steps.quit_verify.outcome }}
        run: |
          printf 'Light: prepare=%s cases=%s verify=%s\n\nQuit: prepare=%s cases=%s verify=%s\n\n' "$LIGHT_PREPARE" "$LIGHT_CASES" "$LIGHT_VERIFY" "$QUIT_PREPARE" "$QUIT_CASES" "$QUIT_VERIFY" >> "$GITHUB_STEP_SUMMARY"
          for report in light-tools-ci native-quit-ci; do
            if test -f "retained-host/reports/$report/summary.md"; then cat "retained-host/reports/$report/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          for state in retained-host/reports/functional-ci/*.json; do
            if test -f "$state"; then cat "$state"; fi
          done
          echo 'Light: all15 reader/compile checks, nine direct headless controls per runtime, six actual stock/light cases, fresh official addon registration, unchanged60s native deadline.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Quit: six stock-first clean/save/discard cases, eight native contracts and12 actual source pins, natural exit0, unchanged150s acceptance and270s outer supervisor bounds.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both groups retain separate independent runtime clones and profiles, red outcomes and unconditional original/selected witnesses. Quit preference/default-handler baseline precedes both groups; its final read-only witness follows all bundle operations. No performance or app-build-variant claim.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original phase outer ceilings remain15/70/5minutes for Quit and20/40/4 for light. Setup, contract checks and reporting bring bounded step ceilings to186minutes; the aggregate job safety ceiling is200minutes. Native acceptance clocks are unchanged. No artifacts, caches, paid runners or deployment.' >> "$GITHUB_STEP_SUMMARY"
