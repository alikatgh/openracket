name: Mac native app generation and real file delivery (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 80
    env:
      PYTHONOPTIMIZE: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Verify exact preview and builder with full runtime witnesses
        id: app_prepare
        timeout-minutes: 8
        run: python3 retained-host/scripts/ci/run-mac-app.py prepare
      - name: Actual source setup and twenty native Racket builder cases
        id: app_install
        if: success() && steps.app_prepare.outcome == 'success'
        timeout-minutes: 20
        run: python3 retained-host/scripts/ci/run-mac-app.py install
      - name: Generate native app and inspect executable, plist and signature
        id: app_build
        if: success() && steps.app_install.outcome == 'success'
        timeout-minutes: 8
        run: python3 retained-host/scripts/ci/run-mac-app.py build
      - name: Install independently reviewed read-only app observer
        id: app_observer
        if: success() && steps.app_build.outcome == 'success'
        timeout-minutes: 6
        run: python3 retained-host/scripts/ci/run-mac-app.py observer
      - name: Genuine Launch Services cold and warm file events
        id: app_launch
        if: success() && steps.app_observer.outcome == 'success'
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-mac-app.py launch
      - name: App-only relocation with real file delivery
        if: always() && steps.app_observer.outcome == 'success'
        timeout-minutes: 7
        run: python3 retained-host/scripts/ci/run-mac-app.py relocate
      - name: Verify whole original runtimes and user preference witnesses
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 5
        run: python3 retained-host/scripts/ci/run-mac-app.py verify
      - name: Report actual app construction and native launch evidence
        if: always()
        run: |
          if test -f retained-host/reports/mac-app-ci/summary.md; then
            cat retained-host/reports/mac-app-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation failed before app evidence was available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Destination-built app tethered to an explicit installed full runtime and the exact tested preview source. Native Racket tests and actual Launch Services file events are separately recorded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The generated runner-local bundle is test evidence, not a distributable self-contained, Developer ID signed or notarized app. No artifact/cache/release or paid runner.' >> "$GITHUB_STEP_SUMMARY"
