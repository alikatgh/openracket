name: Light collapsed-caret contrast pair (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    # Bounded worst-case stage ceilings total131min; job adds1min margin.
    timeout-minutes: 132
    env:
      PYTHONOPTIMIZE: ''
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Complete source and adapter suite, ordinary and real aliased TMPDIR
        timeout-minutes: 5
        run: python3 -B retained-host/scripts/ci/check-light-caret-release.py
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        timeout-minutes: 15
        run: bash retained-host/scripts/ci/light-caret-support/install-full-racket.sh
      - name: Original witnesses and independent exact source preparations
        if: success() && steps.runtime.outcome == 'success'
        timeout-minutes: 70
        run: python3 -B retained-host/scripts/ci/run-light-caret.py prepare
      - name: Independent original and patched Macro Stepper captures
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 25
        run: python3 -B retained-host/scripts/ci/run-light-caret.py cases
      - name: Unconditional final witnesses and complete independent evidence
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 10
        run: python3 -B retained-host/scripts/ci/run-light-caret.py verify
      - name: Report conditional programmatic acceptance
        if: always()
        timeout-minutes: 1
        run: |
          if test -f retained-host/reports/light-caret-ci/summary.md; then cat retained-host/reports/light-caret-ci/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'Exact original/patched modern-light Macro Stepper pair only. Outer60-second process deadline and all inherited host waits unchanged. Reader22/compiler22 and12 separate direct typed controls per arm. Actual original PNGs require independent visual inspection for the fully visible line3 marker before rendered-state acceptance. No paid services, artifact uploads, caches, deployment, memory-limit overrides in measured profiles, or security bypass.' >> "$GITHUB_STEP_SUMMARY"
