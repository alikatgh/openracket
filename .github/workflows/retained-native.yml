name: Mac named-style correctness and completed GUI responsiveness (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 130
    env:
      PYTHONOPTIMIZE: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Prepare exact named-style-only runtime clones and compile dependencies
        id: style_prepare
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 20
        run: python3 retained-host/scripts/ci/run-named-style.py prepare
      - name: Mandatory native telemetry helpers without skips
        id: style_helpers
        if: always() && steps.style_prepare.outcome == 'success'
        timeout-minutes: 12
        run: python3 retained-host/scripts/ci/run-named-style.py helpers
      - name: Actual complete style lookup and publication correctness
        id: style_production
        if: always() && steps.style_prepare.outcome == 'success'
        timeout-minutes: 13
        run: python3 retained-host/scripts/ci/run-named-style.py production
      - name: Actual incremental lexer style and rich WXME equivalence
        id: style_editor
        if: always() && steps.style_prepare.outcome == 'success'
        timeout-minutes: 14
        run: python3 retained-host/scripts/ci/run-named-style.py editor
      - name: Actual Check Syntax and full annotation rename controls
        id: style_controls
        if: always() && steps.style_prepare.outcome == 'success'
        timeout-minutes: 19
        run: python3 retained-host/scripts/ci/run-named-style.py controls
      - name: Six interleaved full completion and heartbeat trials
        id: style_telemetry
        if: always() && steps.style_prepare.outcome == 'success' && steps.style_helpers.outcome == 'success' && steps.style_production.outcome == 'success' && steps.style_editor.outcome == 'success' && steps.style_controls.outcome == 'success'
        timeout-minutes: 40
        run: python3 retained-host/scripts/ci/run-named-style.py telemetry
      - name: Verify the complete original runtime
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 4
        run: python3 retained-host/scripts/ci/run-named-style.py verify
      - name: Report complete native named-style findings
        if: always()
        run: |
          if test -f retained-host/reports/named-style-ci/summary.md; then cat retained-host/reports/named-style-ci/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'One default-off named-style source delta; three interleaved stock/candidate pairs. Same256MiB,20ms scheduling,all tools and original inner deadlines. No artifacts,paid services or result substitution.' >> "$GITHUB_STEP_SUMMARY"
