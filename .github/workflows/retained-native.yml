name: Mac stock memory-limit sensitivity (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Prepare pristine runtime, stock host and memory-setting gates
        id: memory_prepare
        timeout-minutes: 14
        run: python3 retained-host/scripts/ci/run-memory.py prepare
      - name: Nine sequential balanced fresh-profile memory-limit trials
        if: success() && steps.memory_prepare.outcome == 'success'
        timeout-minutes: 20
        run: python3 retained-host/scripts/ci/run-memory.py measure
      - name: Verify original runtime source and bytecode stayed unchanged
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 3
        run: python3 retained-host/scripts/ci/run-memory.py verify
      - name: Report correctness, actual tool outcomes and measured limits
        if: always()
        run: |
          if test -f retained-host/reports/memory-ci/summary.md; then
            cat retained-host/reports/memory-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation failed before a memory sensitivity result was available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Only disposable profile memory varies: 128/256/512 MiB. Actual worker setting verified; original 20 ms coloring budget and all stock tools remain.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Configuration sensitivity, no product default change. All actual OOM, successes, incomplete work and timeouts remain explicit. Different outcomes do not support equal-work speed ratios.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Earlier Stop and broader release gates remain recorded. No artifact/cache/release/package upload or paid runner.' >> "$GITHUB_STEP_SUMMARY"
