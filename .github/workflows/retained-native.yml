name: Retained DrRacket Mac expansion diagnostic (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    timeout-minutes: 22
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Prepare independent initialization-instrumented stock expansion clone
        id: replay_prepare
        timeout-minutes: 9
        run: python3 retained-host/scripts/ci/run-replay.py prepare
      - name: Capture the actual native edited request and full handler registry
        id: replay_capture
        timeout-minutes: 4
        run: python3 retained-host/scripts/ci/run-replay.py capture
      - name: Diagnose two bounded same-process expansion replays
        timeout-minutes: 3
        run: python3 retained-host/scripts/ci/run-replay.py replay
      - name: Verify all pristine runtime files and bytecode stayed untouched
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 3
        run: python3 retained-host/scripts/ci/run-replay.py verify
      - name: Report diagnostic outcomes and scope
        if: always()
        run: |
          if test -f retained-host/reports/replay-ci/summary.md; then
            cat retained-host/reports/replay-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Replay preparation failed before a result was available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Independent diagnostic only: source insertions observe actual stock request/registry and worker initialization. These timings are not a product speed comparison.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Previously passed portable Mac installation/launch/save gates remain recorded at run38064415026. No Actions artifact, cache, release, package or paid-storage upload.' >> "$GITHUB_STEP_SUMMARY"
