name: Mac launcher isolation and relocation probe (public free runner)

'on':
  push:
    branches: ['prototype/retained-drracket']
    paths:
      - 'retained-host/**'
      - '.github/workflows/retained-native.yml'

permissions:
  contents: read

concurrency:
  group: retained-drracket-native
  cancel-in-progress: false

jobs:
  native:
    # These conditions are evaluated before allocating a runner.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alikatgh/openracket' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/prototype/retained-drracket'
    runs-on: macos-15 # Standard free public runner only. No larger runner.
    # Step ceilings total69min (2+3+3+15+35+10+1); job adds1min scheduling margin.
    timeout-minutes: 70
    env:
      PYTHONOPTIMIZE: ''
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Recheck repository is public
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # official v9.0.0
        with:
          debug: false
          retries: 0
          script: |
            // The official client uses this job's existing read-only token.
            // No custom credentials, additional scopes, persistence or token logs.
            try {
              const { data: repo } = await github.rest.repos.get({owner: 'alikatgh', repo: 'openracket'});
              core.info(JSON.stringify({full_name: repo.full_name, private: repo.private, visibility: repo.visibility}));
              if (repo.full_name !== 'alikatgh/openracket' || repo.private !== false || repo.visibility !== 'public') {
                core.setFailed('Public repository required; native validation was not started.');
              }
            } catch (error) {
              const headers = error.response?.headers || {};
              core.info(JSON.stringify({status: error.status, message: error.response?.data?.message,
                rate_limit_remaining: headers['x-ratelimit-remaining'], rate_limit_reset: headers['x-ratelimit-reset']}));
              core.setFailed('Public repository metadata check failed; native validation was not started.');
            }
      - name: Check out exact tested commit
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Complete source adapter and transport checks with aliased TMPDIR
        timeout-minutes: 3
        run: python3 retained-host/scripts/ci/check-launcher-isolation-release.py
      - name: Install checksum-pinned full official Racket 9.3
        id: runtime
        timeout-minutes: 15
        run: bash retained-host/scripts/ci/install-full-racket.sh
      - name: Original witnesses and fixed-exclusion two-location native probe
        id: launcher_isolation
        if: success() && steps.runtime.outcome == 'success'
        # 11 sequential native commands * (120s + 5s cleanup) = 1375s;
        # 35min leaves 725s for full read-only inventories, copy and audits.
        timeout-minutes: 35
        run: python3 retained-host/scripts/ci/run-launcher-isolation.py run
      - name: Independent final witnesses and complete diagnostic transport
        if: always() && steps.runtime.outcome == 'success'
        # One final native handler query <=125s, only from safe state;
        # remaining475s are independent filesystem/evidence margin.
        timeout-minutes: 10
        run: python3 retained-host/scripts/ci/run-launcher-isolation.py verify
      - name: Report bounded observations and remaining acceptance
        if: always()
        timeout-minutes: 1
        run: |
          if test -f retained-host/reports/launcher-isolation-ci/summary.md; then cat retained-host/reports/launcher-isolation-ci/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'Fixed top-level DrRacket.app exclusion in disposable copy only. App launches require zero remaining declaration claims and zero unresolved loader contexts. Native120s plus5s cleanup bounds unchanged; unknown cleanup blocks further native work. No artifacts, caches, paid services, deployment or security bypass. Two-location path/identity acceptance is not distribution acceptance. Original preference file not separately observed.' >> "$GITHUB_STEP_SUMMARY"
