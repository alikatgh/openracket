[package]
name = "openracket"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A focused native Racket workbench, built with Rust and the real Racket runtime"
license = "MIT"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "advanced", "highlighter"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[dev-dependencies]
iced_runtime = "=0.14.0"
iced_graphics = "=0.14.0"
tiny-skia = "=0.11.4"
